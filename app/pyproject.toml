[project]
name = "tracker"
version = "0.1.0"
description = "API that serves most demanded skills and their trends from Australian job listings"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
